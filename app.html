<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Faccliky</title>
  <meta name="theme-color" content="#0e0e11">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="shell.css">
  <script src="temas.js"></script>
</head>
<body class="app-page">
  <header class="app-topo" id="topo">
    <a href="#hoje" class="topo-logo" aria-label="Início"><span class="logo-mark">F</span></a>
    <div class="topo-acoes">
      <button class="topo-buscar" id="abrirBusca" aria-label="Buscar"><span data-ico="search" data-tam="16"></span><span class="t">Buscar</span><kbd>Ctrl K</kbd></button>
      <button class="topo-btn" id="sino" aria-label="Avisos"><span data-ico="bell" data-tam="19"></span><i class="ponto" id="sinoPonto" hidden></i></button>
      <a href="#perfil" class="topo-avatar" id="topoAvatar" aria-label="Perfil"></a>
    </div>
  </header>

  <nav class="dock" id="nav" aria-label="Principal">
    <a href="#hoje" data-tela="hoje" title="Hoje"><span data-ico="home" data-tam="20"></span><span class="t">Hoje</span></a>
    <a href="#agenda" data-tela="agenda" title="Agenda"><span data-ico="cal" data-tam="20"></span><span class="t">Agenda</span></a>
    <a href="#kliky" data-tela="kliky" title="Kliky"><span data-ico="bot" data-tam="20"></span><span class="t">Kliky</span></a>
    <a href="#contas" data-tela="contas" title="Contas"><span data-ico="money" data-tam="20"></span><span class="t">Contas</span></a>
    <a href="#habitos" data-tela="habitos" title="Hábitos"><span data-ico="flame" data-tam="20"></span><span class="t">Hábitos</span></a>
    <a href="#grupos" data-tela="grupos" title="Grupos"><span data-ico="users" data-tam="20"></span><span class="t">Grupos</span></a>
    <i class="sep"></i>
    <button class="mais" id="maisBt" aria-label="Criar" aria-expanded="false"><span data-ico="plus" data-tam="22"></span></button>
  </nav>

  <main class="conteudo" id="conteudo">
    <div class="carregando"><img src="assets/kliky.svg" alt="" width="90" height="104"><p>Carregando…</p></div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="kliky.js"></script>
  <script src="pixels.js"></script>
  <script src="app.js"></script>
  <script src="perfil.js"></script>
  <script src="hoje.js"></script>
  <script src="agenda.js"></script>
  <script src="shell.js"></script>
</body>
</html>
